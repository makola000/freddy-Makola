<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{height:100vh;display:flex;flex-direction:column}

.bar{padding:10px;background:#202c33;display:flex;gap:8px}.bar input{flex:1;padding:12px;border-radius:25px;border:none;background:#2a3942;color:#fff}
