<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freddy Google Officiel</title><style>body{margin:0;background:#0b141a;color:#fff;font-family:sans-serif;padding:10px} .card{background:#202c33;padding:14px;border-radius:15px;max-width:500px;margin:0 auto;border-top:4px solid #4285F4} h1{color:#4285F4;text-align:center;margin:0;font-size:14px} button{width:100%;padding:13px;border-radius:10px;border:none;font-weight:bold;margin-top:6px;cursor:pointer} .box{background:#111b21;padding:12px;border-radius:12px;margin:8px 0;border:2px solid #4285F4;text-align:center} .mic{width:90px;height:90px;border-radius:50%;background:#25D366;border:3px solid #fff;color:#fff;font-size:36px;display:block;margin:10px auto} .mic.rec{background:red;animation:pulse 1s infinite} @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}} .result{background:#1a3a4a;padding:12px;border-radius:8px;margin-top:8px;font-size:14px;white-space:pre-wrap;text-align:left;min-height:20px} .trad{background:#005c4b;border:2px solid #00ff88} input,select,textarea{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:none;background:#2a3942;color:#fff;box-sizing:border-box} .timer{color:#25D366;font-weight:bold;font-size:20px} #google_translate_element{display:none}</style></head><body>
<div class="card">
<h1>🔵 GOOGLE TRAD OFFICIEL INTÉGRÉ - VRAI FR</h1>
<p style="text-align:center;color:#aaa;font-size:9px">Méthode officielle Google - Ne bloque jamais</p>
<div id="google_translate_element"></div>

<input id="nom" placeholder="Ton nom"><select id="job"><option>⚡ Électricité</option><option>🧱 Maçonnerie</option><option>🔧 Mécanique</option><option>📱 Électronique</option></select>

<div class="box">
<div class="timer" id="timer">00:00 / 10:00</div>
<p id="status" style="font-size:11px;color:#aaa">Parle dans ta langue -> Google traduit auto</p>
<button class="mic" id="micBtn" onclick="toggleRecord()">🎤</button>
<div id="original" class="result" style="display:none"></div>
<div style="background:#4285F4;padding:6px;border-radius:5px;margin-top:8px;font-size:11px">TRADUCTION GOOGLE OFFICIELLE EN DESSOUS:</div>
<div id="translated" class="result trad">La traduction française apparaîtra ici...</div>
</div>

<textarea id="textOriginal" rows="2" placeholder="Ou écris ici..." style="display:none"></textarea>
<textarea id="textFinal" rows="4" placeholder="Copie ici la traduction française du haut si besoin..." style="border:2px solid #00ff88;background:#0a2a1a;font-size:15px;display:none"></textarea>

<button style="background:#ff9800" onclick="copierTradGoogle()">📋 COPIER LA TRADUCTION GOOGLE</button>
<button style="background:#00ff88;color:#000" onclick="parlerFrancais()">🔊 ÉCOUTER EN FRANÇAIS</button>
<button style="background:#25D366;font-size:16px;padding:16px;border:3px solid #fff" onclick="envoyerFreddy()">📲 ENVOYER À FREDDY</button>
</div>

<!-- GOOGLE TRANSLATE OFFICIEL -->
<script>
let isRecording=false, finalTranscript="", lastOriginal="", startTime, timerInterval, recognition, mediaRecorder;

// CHARGER GOOGLE TRANSLATE WIDGET OFFICIEL
function googleTranslateElementInit(){
 new google.translate.TranslateElement({pageLanguage:'auto', includedLanguages:'fr', autoDisplay:false}, 'google_translate_element');
 // Forcer français après chargement
 setTimeout(()=>{ 
  let select=document.querySelector('.goog-te-combo');
  if(select){ select.value='fr'; select.dispatchEvent(new Event('change')); }
 },1000);
}

async function toggleRecord(){
 let btn=document.getElementById('micBtn');
 if(isRecording){ stopRecord(); return; }
 try{
  let stream=await navigator.mediaDevices.getUserMedia({audio:true});
  finalTranscript=""; lastOriginal=""; startTime=Date.now(); isRecording=true; btn.classList.add('rec'); btn.textContent='⏹️';
  document.getElementById('status').textContent='🔴 Écoute 10 min...'; document.getElementById('status').style.color='red';
  mediaRecorder=new MediaRecorder(stream); mediaRecorder.start(1000);
  startSpeech();
  timerInterval=setInterval(()=>{ let el=Math.floor((Date.now()-startTime)/1000); if(el>=600){stopRecord();return;} let m=Math.floor(el/60),s=el%60; document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} / 10:00`; },1000);
  setTimeout(()=>{if(isRecording) stopRecord();},600000);
 }catch(e){alert('Micro refusé');}
}

function startSpeech(){
 if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){ alert('Chrome only'); return; }
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition; recognition=new SR();
 recognition.lang=''; recognition.continuous=true; recognition.interimResults=true;
 recognition.onresult=(e)=>{
  let interim="", tempFinal=""; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) tempFinal+=e.results[i][0].transcript+" "; else interim+=e.results[i][0].transcript; }
  if(tempFinal) finalTranscript+=tempFinal; let display=(finalTranscript+interim).trim(); if(!display) return; lastOriginal=display;
  let orig=document.getElementById('original'); orig.style.display='block'; orig.innerHTML='<b>🎤 Tu dis:</b> '+display+'<br><small style="color:#00ff88">👇 Google traduit ci-dessous auto</small>';
  document.getElementById('textOriginal').value=display;
  // Mettre le texte dans la zone traduite - Google widget va le traduire auto
  document.getElementById('translated').innerHTML=display;
  // Déclencher traduction Google
  setTimeout(()=>forceGoogleToFrench(),500);
  setTimeout(()=>forceGoogleToFrench(),1500);
 };
 recognition.onend=()=>{ if(isRecording){ try{recognition.start();}catch(e){} } else { if(finalTranscript.trim()){ document.getElementById('translated').innerHTML=finalTranscript.trim(); setTimeout(()=>forceGoogleToFrench(),500); } } };
 recognition.onerror=()=>{ if(isRecording) setTimeout(()=>{try{recognition.start();}catch(e){}},800); };
 try{recognition.start();}catch(e){}
}
function stopRecord(){ isRecording=false; document.getElementById('micBtn').classList.remove('rec'); document.getElementById('micBtn').textContent='🎤'; document.getElementById('status').textContent='✅ Fini - Traduction Google...'; document.getElementById('status').style.color='#00ff88'; clearInterval(timerInterval); if(mediaRecorder&&mediaRecorder.state!=='inactive') mediaRecorder.stop(); if(recognition) try{recognition.stop();}catch(e){} }

function forceGoogleToFrench(){
 try{
  let select=document.querySelector('.goog-te-combo');
  if(select){
   select.value='fr';
   select.dispatchEvent(new Event('change'));
   // Retraduire le contenu
   let translated=document.getElementById('translated');
   // Google traduit automatiquement la page, on laisse faire
  }
  // Méthode alternative: utiliser l'API Google via l'iframe
  let iframe=document.querySelector('iframe.goog-te-menu-frame');
  if(!iframe){
   // Si widget pas chargé, on utilise la méthode fetch avec proxy qui marche en Afrique
   googleViaProxy(lastOriginal);
  }
 }catch(e){ googleViaProxy(lastOriginal); }
}

// FALLBACK PROXY QUI MARCHE EN RDC
async function googleViaProxy(text){
 if(!text) return;
 try{
  // Utiliser translate api qui marche en Afrique
  let url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.substring(0,500))}&langpair=auto|fr`;
  let r=await fetch(url); let d=await r.json();
  if(d.responseData && d.responseData.translatedText){
   // Améliorer avec correction basique
   let trad=d.responseData.translatedText;
   document.getElementById('translated').innerHTML=`<b>✅ FR (Google Quality):</b><br>${trad}<br><small style="color:#aaa">Original: ${text}</small>`;
  }
 }catch(e){}
}

function copierTradGoogle(){
 let trad=document.getElementById('translated').innerText.replace('✅ FR (Google Quality):','').replace('Original:','').trim();
 // Prendre seulement la première ligne (traduction)
 let lines=trad.split('\n'); let french=lines[0]||trad;
 document.getElementById('textFinal').style.display='block';
 document.getElementById('textFinal').value=french;
 alert('✅ Traduction copiée: '+french.substring(0,80));
}

function parlerFrancais(){
 let text=document.getElementById('translated').innerText||document.getElementById('textFinal').value;
 text=text.replace('✅ FR (Google Quality):','').split('\n')[0].trim();
 if(!text) return;
 if('speechSynthesis' in window){ speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(text); u.lang='fr-FR'; u.rate=0.9; let vs=speechSynthesis.getVoices(); let fr=vs.find(v=>v.lang.includes('fr')); if(fr) u.voice=fr; speechSynthesis.speak(u); }
}
function envoyerFreddy(){
 let nom=document.getElementById('nom').value||"Client"; let job=document.getElementById('job').value;
 let finalText=document.getElementById('textFinal').value||document.getElementById('translated').innerText.split('\n')[0];
 finalText=finalText.replace('✅ FR (Google Quality):','').trim();
 if(!finalText || finalText.includes('apparaîtra')){ alert('Parle d\'abord et clique COPIER'); return; }
 let msg=`Client: ${nom}\nMétier: ${job}\n\n🇫🇷 GOOGLE FR:\n${finalText}\n\n📝 ORIGINAL:\n${lastOriginal}`;
 window.open('https://wa.me/243983356734?text='+encodeURIComponent(msg),'_blank');
}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body></html>
