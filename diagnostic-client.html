<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freddy Final Simple FR</title><style>body{margin:0;background:#0b141a;color:#fff;font-family:sans-serif;padding:12px} .card{background:#202c33;padding:16px;border-radius:16px;max-width:480px;margin:auto;border-top:4px solid #25D366} h1{color:#25D366;text-align:center;font-size:16px;margin:0} button{width:100%;padding:14px;border-radius:10px;border:none;font-weight:bold;margin-top:8px} .mic{width:90px;height:90px;border-radius:50%;background:#25D366;border:3px solid #fff;color:#fff;font-size:34px;display:block;margin:12px auto} .mic.rec{background:red} .box{background:#111b21;padding:12px;border-radius:12px;border:2px solid #25D366;margin:10px 0;text-align:center} .r{background:#1a3a4a;padding:12px;border-radius:10px;margin-top:8px;font-size:14px;white-space:pre-wrap;text-align:left} .t{background:#005c4b;border-left:4px solid #00ff88} input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#2a3942;color:#fff;box-sizing:border-box} .timer{color:#25D366;font-weight:bold}</style></head><body>
<div class="card">
<h1>🎤 VOIX AUTO -> FRANÇAIS AUTO</h1>

<input id="nom" placeholder="Ton nom">
<select id="fromLang"><option value="auto">🌐 Détecter auto</option><option value="zh">🇨🇳 Chinois</option><option value="en">🇬🇧 Anglais</option><option value="sw">🇹🇿 Swahili</option><option value="ln">🇨🇩 Lingala</option></select>
<select id="job"><option>⚡ Électricité</option><option>🧱 Maçonnerie</option><option>🔧 Mécanique</option><option>📱 Électronique</option></select>

<div class="box">
<div class="timer" id="timer">00:00 / 10:00</div>
<p id="status" style="font-size:11px;color:#aaa">Clique micro et parle</p>
<button class="mic" id="micBtn" onclick="toggleRecord()">🎤</button>
<div id="original" class="r" style="display:none"></div>
<div id="translated" class="r t" style="display:none">Traduction FR ici...</div>
</div>

<textarea id="textOriginal" rows="3" placeholder="Ou écris dans ta langue ici..."></textarea>
<button style="background:#4285F4" onclick="tradFromText()">🔵 TRADUIRE EN FRANÇAIS MAINTENANT</button>

<textarea id="textFinal" rows="4" placeholder="Français final ici..." style="border:2px solid #00ff88;background:#0a2a1a;font-size:16px;font-weight:bold"></textarea>

<button style="background:#ff9800" onclick="parlerFrancais()">🔊 ÉCOUTER FR</button>
<button style="background:#25D366;font-size:17px;padding:16px;border:3px solid #fff" onclick="envoyerFreddy()">📲 ENVOYER À FREDDY</button>
</div>

<script>
let isRecording=false, finalTranscript="", lastOriginal="", startTime, timerInterval, recognition, mediaRecorder;

async function toggleRecord(){
 let b=document.getElementById('micBtn');
 if(isRecording){ stopRecord(); return; }
 try{
  let s=await navigator.mediaDevices.getUserMedia({audio:true});
  finalTranscript=""; lastOriginal=""; startTime=Date.now(); isRecording=true; b.classList.add('rec'); b.textContent='⏹️';
  document.getElementById('status').textContent='🔴 Écoute... Parle!'; document.getElementById('status').style.color='red';
  mediaRecorder=new MediaRecorder(s); mediaRecorder.start();
  startSpeech();
  timerInterval=setInterval(()=>{ let e=Math.floor((Date.now()-startTime)/1000); if(e>=600){stopRecord();return;} let m=Math.floor(e/60),ss=e%60; document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')} / 10:00`; },1000);
  setTimeout(()=>{if(isRecording) stopRecord();},600000);
 }catch(e){alert('Micro refusé, utilise Chrome');}
}
function startSpeech(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ alert('Chrome only'); return; }
 recognition=new SR(); recognition.lang=''; recognition.continuous=true; recognition.interimResults=true;
 recognition.onresult=(e)=>{
  let inter="", fin=""; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) fin+=e.results[i][0].transcript+" "; else inter+=e.results[i][0].transcript; }
  if(fin) finalTranscript+=fin; let display=(finalTranscript+inter).trim(); if(!display) return; lastOriginal=display;
  let o=document.getElementById('original'); o.style.display='block'; o.innerHTML='<b>🎤 Tu dis:</b> '+display;
  document.getElementById('textOriginal').value=display;
  clearTimeout(window.t1); window.t1=setTimeout(()=>{ traduire(display); },1200);
 };
 recognition.onend=()=>{ if(isRecording) try{recognition.start();}catch(e){} };
 try{recognition.start();}catch(e){}
}
function stopRecord(){ isRecording=false; document.getElementById('micBtn').classList.remove('rec'); document.getElementById('micBtn').textContent='🎤'; document.getElementById('status').textContent='✅ Voice fini'; clearInterval(timerInterval); if(mediaRecorder&&mediaRecorder.state!=='inactive') mediaRecorder.stop(); if(recognition) try{recognition.stop();}catch(e){} if(finalTranscript.trim()) traduire(finalTranscript.trim()); }

async function traduire(text){
 if(!text) return; let fl=document.getElementById('fromLang').value; let td=document.getElementById('translated'); let tf=document.getElementById('textFinal');
 td.style.display='block'; td.innerHTML='🔄 Traduction vers Français...';
 let source=fl==='auto'?'auto':fl;
 let result=null;

 // 1. MyMemory - marche toujours en RDC
 try{
  let url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.substring(0,500))}&langpair=${source}|fr`;
  let r=await fetch(url); let d=await r.json();
  if(d.responseData && d.responseData.translatedText && d.responseData.translatedText.length>2){
   // Si MyMemory renvoie même texte, on essaie autre
   if(d.responseData.translatedText.toLowerCase()!==text.toLowerCase().substring(0,500)){
    result=d.responseData.translatedText; td.innerHTML=`<b>✅ FR:</b><br>${result}`;
   }
  }
 }catch(e){}

 // 2. Si pas bon, LibreTranslate
 if(!result){
  try{
   let r=await fetch('https://libretranslate.com/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:text.substring(0,500),source:source==='auto'?'auto':source,target:'fr',format:'text'})});
   let d=await r.json(); if(d.translatedText){ result=d.translatedText; td.innerHTML=`<b>✅ FR:</b><br>${result}`; }
  }catch(e){}
 }

 if(result){ tf.value=result; setTimeout(parlerFrancais,500); } else { td.innerHTML=`⚠️ Pas traduit. J'envoie original. <br>${text}`; tf.value=text; }
}

function tradFromText(){ let t=document.getElementById('textOriginal').value; if(t) traduire(t); }
function parlerFrancais(){ let t=document.getElementById('textFinal').value.trim(); if(!t) return; if('speechSynthesis' in window){ speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(t); u.lang='fr-FR'; u.rate=0.9; speechSynthesis.speak(u); } }
function envoyerFreddy(){ let nom=document.getElementById('nom').value||"Client"; let job=document.getElementById('job').value; let finalText=document.getElementById('textFinal').value.trim(); if(!finalText){ alert('Parle ou écris d\'abord'); return; } let msg=`Client: ${nom}\nMétier: ${job}\n\n🇫🇷 FR:\n${finalText}\n\n📝 ORIGINAL:\n${lastOriginal||document.getElementById('textOriginal').value}`; window.open('https://wa.me/243983356734?text='+encodeURIComponent(msg),'_blank'); }
</script></body></html>
