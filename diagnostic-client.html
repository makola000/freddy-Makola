<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice 10 Min Trad Fix - Freddy</title><style>body{margin:0;background:#0b141a;color:#fff;font-family:sans-serif;padding:12px} .card{background:#202c33;padding:16px;border-radius:15px;max-width:500px;margin:0 auto;border-top:4px solid #25D366} h1{color:#25D366;text-align:center;margin:0} button{width:100%;padding:15px;border-radius:12px;border:none;font-weight:bold;margin-top:8px;cursor:pointer} .voice{background:#111b21;padding:15px;border-radius:15px;margin:12px 0;border:2px solid #25D366;text-align:center} .mic{width:90px;height:90px;border-radius:50%;background:#25D366;border:4px solid #fff;color:#fff;font-size:40px} .mic.rec{background:#ff0000;animation:pulse 0.8s infinite} @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}} .timer{font-size:32px;color:#25D366;font-weight:bold} .bar{height:6px;background:#333;border-radius:3px;overflow:hidden;margin:8px 0} .fill{height:100%;background:#25D366;width:0%} .result{background:#1a3a4a;padding:12px;border-radius:8px;margin-top:8px;font-size:14px;max-height:300px;overflow:auto;display:none;white-space:pre-wrap} input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#2a3942;color:#fff;box-sizing:border-box}</style></head><body>
<div class="card"><h1>🎤 VOICE 10 MIN - TRAD FIX</h1>
<div style="display:flex;gap:5px"><select id="langFrom"><option value="auto">🌍 Auto-détecter (recommandé)</option><option value="zh-CN">🇨🇳 Mandarin</option><option value="en">🇺🇸 Anglais</option><option value="sw">Swahili</option><option value="fr">Français</option><option value="ln">Lingala</option></select><select id="job"><option>⚡ Élec</option><option>🧱 Maçon</option><option>🔧 Méca</option><option>📱 Élec'nique</option></select></div>
<div class="voice"><div class="timer" id="timer">00:00 / 10:00</div><div class="bar"><div class="fill" id="fill"></div></div><p id="status" style="font-size:12px">Appuie pour parler 10 min - Trad auto FR</p><button class="mic" id="micBtn" onclick="toggleRecord()">🎤</button><div id="original" class="result"></div><div id="translated" class="result" style="background:#005c4b;border-left:4px solid #25D366"></div></div>
<input id="nom" placeholder="Ton nom"><textarea id="desc" rows="4" placeholder="Ici apparaît français..."></textarea>
<button style="background:#ff9800" onclick="traduireMaintenant()">🌐 TRADUIRE EN FRANÇAIS MAINTENANT</button>
<button style="background:#25D366;font-size:16px" onclick="envoyerFreddy()">📲 ENVOYER À FREDDY EN FR</button>
<p style="font-size:10px;color:#888;text-align:center">TEST: Dis "你好我的插座坏了" -> Doit devenir "Bonjour ma prise est cassée"</p></div>
<script>
let isRecording=false, mediaRecorder, audioChunks=[], timerInterval, recognition, finalTranscript="", lastOriginal="", lastTranslated="", startTime;

async function toggleRecord(){
 let btn=document.getElementById('micBtn');
 if(isRecording){ stopRecord(); return; }
 try{
  let stream=await navigator.mediaDevices.getUserMedia({audio:true});
  audioChunks=[]; finalTranscript=""; startTime=Date.now(); isRecording=true; btn.classList.add('rec'); btn.textContent='⏹️';
  document.getElementById('status').textContent='🔴 Enregistrement... Parle!'; document.getElementById('status').style.color='red';
  mediaRecorder=new MediaRecorder(stream); mediaRecorder.ondataavailable=e=>{if(e.data.size>0) audioChunks.push(e.data)}; mediaRecorder.start(1000);
  startSpeechRecognition();
  timerInterval=setInterval(()=>{ let el=Math.floor((Date.now()-startTime)/1000); if(el>=600){stopRecord();return;} let m=Math.floor(el/60),s=el%60; document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} / 10:00`; document.getElementById('fill').style.width=(el/600*100)+'%'; },1000);
  setTimeout(()=>{if(isRecording) stopRecord();},600000);
 }catch(e){alert('Micro refusé');}
}
function startSpeechRecognition(){
 if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return;
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition; recognition=new SR();
 let lang=document.getElementById('langFrom').value; recognition.lang=lang==='auto'?'':lang; recognition.continuous=true; recognition.interimResults=true;
 recognition.onresult=(e)=>{
  let interim="", tempFinal=""; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) tempFinal+=e.results[i][0].transcript+" "; else interim+=e.results[i][0].transcript; }
  if(tempFinal) finalTranscript+=tempFinal; let display=finalTranscript+interim; lastOriginal=display;
  let orig=document.getElementById('original'); orig.style.display='block'; orig.innerHTML='<b>🎤 Original ('+display.length+' car):</b>\n'+display;
  document.getElementById('desc').value=display;
  if(display.length>5){ clearTimeout(window.autoTrad); window.autoTrad=setTimeout(()=>traduireMaintenant(),1500); }
 };
 recognition.onend=()=>{ if(isRecording){ try{recognition.start();}catch(e){} } };
 recognition.onerror=()=>{ if(isRecording) setTimeout(()=>{try{recognition.start();}catch(e){}},500); };
 try{recognition.start();}catch(e){}
}
function stopRecord(){ isRecording=false; document.getElementById('micBtn').classList.remove('rec'); document.getElementById('micBtn').textContent='🎤'; document.getElementById('status').textContent='✅ Terminé'; document.getElementById('status').style.color='#25D366'; clearInterval(timerInterval); if(mediaRecorder&&mediaRecorder.state!=='inactive') mediaRecorder.stop(); if(recognition) try{recognition.stop();}catch(e){} if(finalTranscript) traduireMaintenant(); }

// NOUVELLE FONCTION TRADUCTION QUI MARCHE POUR TOUTES LANGUES
async function traduireGoogle(text, from='auto', to='fr'){
 try{
  // Méthode 1: Google free API (marche pour mandarin, swahili, etc)
  let url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
  let res=await fetch(url);
  let data=await res.json();
  let trad=data[0].map(s=>s[0]).join('');
  return trad;
 }catch(e){ return null; }
}

async function traduireMaintenant(){
 let text=document.getElementById('desc').value||lastOriginal;
 if(!text.trim()){ alert('Parle d\'abord'); return; }
 lastOriginal=text;
 let from=document.getElementById('langFrom').value; if(from==='auto') from='auto'; if(from.includes('-')) from=from.split('-')[0];
 let div=document.getElementById('translated'); div.style.display='block'; div.innerHTML='🌐 Traduction Google en cours... (Mandarin->FR)';
 
 let trad=await traduireGoogle(text, from, 'fr');
 if(trad && trad.toLowerCase()!==text.toLowerCase()){
  lastTranslated=trad; div.innerHTML=`<b>✅ TRADUIT EN FRANÇAIS:</b>\n<span style="font-size:16px;font-weight:bold">${trad}</span>\n\n---\nOriginal: ${text}`;
  document.getElementById('desc').value=trad;
 }else{
  // Fallback MyMemory
  try{
   let url2=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|fr`;
   let r=await fetch(url2); let d=await r.json(); trad=d.responseData.translatedText;
   lastTranslated=trad; div.innerHTML=`<b>✅ Traduit (fallback):</b>\n${trad}`; document.getElementById('desc').value=trad;
  }catch(e){
   div.innerHTML=`⚠️ Traduction bloquée par navigateur.\n\nSolution: Copie ton texte et ouvre translate.google.com\n\nTexte original:\n${text}\n\nMais on envoie quand même à Freddy, il traduira de son côté.`;
   lastTranslated=text;
  }
 }
}

function envoyerFreddy(){
 let nom=document.getElementById('nom').value||"Client"; let job=document.getElementById('job').value;
 let finalText=lastTranslated||document.getElementById('desc').value; if(!finalText) return alert('Parle d\'abord');
 let msg=`🎤 VOICE CLIENT 10MIN\nNom: ${nom}\nMétier: ${job}\n\n🇫🇷 FRANÇAIS POUR FREDDY:\n${finalText}\n\n📝 ORIGINAL (${document.getElementById('langFrom').value}):\n${lastOriginal}`;
 window.open('https://wa.me/243983356734?text='+encodeURIComponent(msg),'_blank');
}
</script></body></html>
