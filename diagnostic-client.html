<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRAI GOOGLE ONLY</title><style>body{margin:0;background:#0b141a;color:#fff;font-family:sans-serif;padding:12px}.card{background:#202c33;padding:16px;border-radius:16px;max-width:480px;margin:auto;border-top:4px solid #4285F4}h1{color:#4285F4;text-align:center;font-size:15px}button{width:100%;padding:14px;border-radius:10px;border:none;font-weight:bold;margin-top:8px}.mic{width:90px;height:90px;border-radius:50%;background:#4285F4;border:3px solid #fff;color:#fff;font-size:34px;display:block;margin:12px auto}.mic.rec{background:red}input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#2a3942;color:#fff;box-sizing:border-box}.box{background:#111b21;padding:12px;border-radius:12px;border:2px solid #4285F4;text-align:center}.r{background:#1a3a4a;padding:10px;border-radius:8px;margin-top:8px;text-align:left;white-space:pre-wrap}.t{background:#005c4b;border-left:4px solid #00ff88}</style></head><body><div class="card"><h1>🔵 VRAI GOOGLE TRANSLATE ONLY</h1><input id="nom" placeholder="Ton nom"><select id="job"><option>⚡ Électricité</option><option>🧱 Maçonnerie</option><option>🔧 Mécanique</option><option>📱 Électronique</option></select><div class="box"><p id="status" style="font-size:11px">Clique micro et parle</p><button class="mic" id="micBtn" onclick="toggleRecord()">🎤</button><div id="original" class="r" style="display:none"></div><div id="translated" class="r t" style="display:none">Traduction vrai Google ici...</div></div><textarea id="textFinal" rows="4" placeholder="Français VRAI GOOGLE ici..." style="border:2px solid #00ff88;background:#0a2a1a;font-size:16px;font-weight:bold"></textarea><button style="background:#ff9800" onclick="parlerFrancais()">🔊 ÉCOUTER FR</button><button style="background:#25D366;font-size:17px;padding:16px;border:3px solid #fff" onclick="envoyerFreddy()">📲 ENVOYER À FREDDY</button></div><script>let isRecording=false,finalTranscript="",lastOriginal="",recognition,mediaRecorder;async function toggleRecord(){let b=document.getElementById('micBtn');if(isRecording){stopRecord();return}try{let s=await navigator.mediaDevices.getUserMedia({audio:true});finalTranscript="";lastOriginal="";isRecording=true;b.classList.add('rec');b.textContent='⏹️';document.getElementById('status').textContent='🔴 Parle...';document.getElementById('status').style.color='red';mediaRecorder=new MediaRecorder(s);mediaRecorder.start();startSpeech();setTimeout(()=>{if(isRecording)stopRecord()},600000)}catch(e){alert('Micro refusé')}}function startSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;recognition=new SR();recognition.lang='';recognition.continuous=true;recognition.interimResults=true;recognition.onresult=(e)=>{let inter="",fin="";for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+" ";else inter+=e.results[i][0].transcript}if(fin)finalTranscript+=fin;let d=(finalTranscript+inter).trim();if(!d)return;lastOriginal=d;let o=document.getElementById('original');o.style.display='block';o.innerHTML='🎤 '+d;clearTimeout(window.t1);window.t1=setTimeout(()=>{vraiGoogle(d)},800)};recognition.onend=()=>{if(isRecording)try{recognition.start()}catch(e){}};try{recognition.start()}catch(e){}}function stopRecord(){isRecording=false;document.getElementById('micBtn').classList.remove('rec');document.getElementById('micBtn').textContent='🎤';document.getElementById('status').textContent='✅ Google traduit...';if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();if(recognition)try{recognition.stop()}catch(e){}if(finalTranscript.trim())vraiGoogle(finalTranscript.trim())}async function vraiGoogle(text){if(!text)return;let td=document.getElementById('translated');let tf=document.getElementById('textFinal');td.style.display='block';td.innerHTML='🔵 Vrai Google traduit...';try{let googleUrl=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=fr&dt=t&q=${encodeURIComponent(text)}`;let proxy=`https://api.allorigins.win/raw?url=${encodeURIComponent(googleUrl)}`;let r=await fetch(proxy);let data=await r.json();let trad="";if(data&&data[0]){for(let i=0;i<data[0].length;i++){if(data[0][i][0])trad+=data[0][i][0]}}if(trad){td.innerHTML=`<b>✅ VRAI GOOGLE FR:</b><br>${trad}`;tf.value=trad;parlerFrancais();return}}catch(e){}try{let googleUrl2=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=fr&dt=t&q=${encodeURIComponent(text)}`;let proxy2=`https://corsproxy.io/?${encodeURIComponent(googleUrl2)}`;let r2=await fetch(proxy2);let data2=await r2.json();let trad2="";if(data2&&data2[0]){for(let i=0;i<data2[0].length;i++){if(data2[0][i][0])trad2+=data2[0][i][0]}}if(trad2){td.innerHTML=`<b>✅ VRAI GOOGLE FR:</b><br>${trad2}`;tf.value=trad2;parlerFrancais();return}}catch(e){}td.innerHTML='❌ Google bloqué temporairement, réessaye';}function parlerFrancais(){let t=document.getElementById('textFinal').value.trim();if(!t)return;if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=0.9;speechSynthesis.speak(u)}}function envoyerFreddy(){let nom=document.getElementById('nom').value||"Client";let job=document.getElementById('job').value;let ft=document.getElementById('textFinal').value.trim();if(!ft){alert('Parle d\'abord');return}let msg=`Client: ${nom}\nMétier: ${job}\n\n🇫🇷 VRAI GOOGLE FR:\n${ft}\n\nORIGINAL:\n${lastOriginal}`;window.open('https://wa.me/243983356734?text='+encodeURIComponent(msg),'_blank')}}</script></body></html>
