<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freddy WhatsApp Business + IA</title><style>body{margin:0;background:#0b141a;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh} .top{background:#202c33;padding:12px;display:flex;justify-content:space-between} .top b{color:#25D366} .switch{padding:8px;background:#111b21;display:flex;gap:8px;justify-content:center} .switch button{padding:8px 14px;border-radius:20px;border:none;cursor:pointer} .active{background:#25D366;color:#fff} .msgs{flex:1;overflow:auto;padding:12px} .msg{padding:10px 12px;border-radius:12px;margin:6px 0;max-width:80%;word-break:break-word} .me{background:#005c4b;margin-left:auto} .them{background:#202c33} .ai{background:#1a3a4a;border-left:4px solid #25D366} .bar{background:#202c33;padding:10px;display:flex;gap:8px} .bar input{flex:1;padding:14px;border-radius:25px;border:none;background:#2a3942;color:#fff} .btn{background:#25D366;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;color:#fff;font-size:20px}</style></head><body>
<div class="top"><b>Freddy Business + IA 🤖</b><a href="index.html" style="color:#25D366;text-decoration:none">Accueil</a></div>
<div class="switch">
<button id="bClient" class="active" onclick="mode='client';this.classList.add('active');document.getElementById('bAI').classList.remove('active')">💬 Client</button>
<button id="bAI" onclick="mode='ai';this.classList.add('active');document.getElementById('bClient').classList.remove('active')">🤖 Freddy IA</button>
<button onclick="call()">📞 Appel</button>
</div>
<div class="msgs" id="box"></div>
<div class="bar">
<input id="txt" placeholder="Écris ici..." onkeydown="if(event.key==='Enter')send()">
<button class="btn" onclick="send()">➤</button>
</div>
<script>
let mode='client';
let msgs=JSON.parse(localStorage.getItem('freddy_biz')||'[]');
let aiKnowledge=`Tu es Freddy IA, assistant business de Freddy Makola à Lubumbashi. Tu aides les clients comme un vrai WhatsApp Business. Tu réponds en lingala, swahili ou français selon le client. Tu es poli, rapide, business.`;

function render(){let b=document.getElementById('box');b.innerHTML='';msgs.forEach(m=>{let d=document.createElement('div');d.className='msg '+m.c;d.innerHTML=m.t;b.appendChild(d)});b.scrollTop=b.scrollHeight}
function add(t,c){msgs.push({t:t,c:c});localStorage.setItem('freddy_biz',JSON.stringify(msgs));render()}

function send(){
let i=document.getElementById('txt');let v=i.value.trim();if(!v)return;
add(v+'<br><small>'+new Date().toLocaleTimeString()+'</small>','me');
i.value='';
if(mode==='ai'){
setTimeout(()=>{
let rep=getAIReply(v);
add('🤖 Freddy IA: '+rep+'<br><small>'+new Date().toLocaleTimeString()+'</small>','ai');
},800);
}
}

function getAIReply(q){
q=q.toLowerCase();
if(q.includes('bonjour')||q.includes('salut')||q.includes('mbote'))return 'Mbote ! Bienvenue chez Freddy Business. Comment puis-je vous aider aujourd’hui ?';
if(q.includes('prix')||q.includes('combien'))return 'Pour les prix, dis-moi quel service tu veux et je te fais un devis rapide.';
if(q.includes('adresse')||q.includes('ou es tu')||q.includes('lubumbashi'))return 'Nous sommes à Lubumbashi, Katanga. On peut livrer ou vous recevoir sur RDV.';
if(q.includes('whatsapp')||q.includes('numero'))return 'Tu peux me joindre ici même, ou sur WhatsApp direct au +243... (ajoute ton numéro ici)';
if(q.includes('merci'))return 'Merci beaucoup ! N’hésite pas si tu as besoin.';
return 'Merci pour ton message : "'+q+'". Je suis Freddy IA, je réponds comme Meta AI. Explique-moi ton besoin business et je t’aide tout de suite. (Tu peux aussi passer en mode Client pour envoyer au vrai WhatsApp)';
}
function call(){let n=prompt('Numéro à appeler ? ex: 243812345678');if(n)window.open('tel:'+n)}
render();
if(msgs.length==0){add('👋 Bienvenue sur WhatsApp Freddy Business !<br>Mode Client = tu parles à un humain<br>Mode Freddy IA = je réponds comme Meta AI ici','them')}
</script></body></html>
