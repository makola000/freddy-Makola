<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREDDY MAKOLA - WhatsApp Pro Ultime</title><style>body{margin:0;background:#0b141a;color:#fff;font-family:sans-serif;display:flex;height:100vh} .left{width:40%;background:#111b21;border-right:1px solid #222;display:flex;flex-direction:column} .right{flex:1;display:flex;flex-direction:column} .top-big{background:#111b21;padding:10px;text-align:center;border-bottom:3px solid #25D366} .top-big h1{margin:0;color:#25D366;font-size:24px} .jobs{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:6px} .jobs button{padding:5px 7px;border-radius:12px;border:1px solid #25D366;background:transparent;color:#25D366;font-size:10px} .jobs button.active{background:#25D366;color:#fff} .list{flex:1;overflow:auto} .contact{padding:9px;border-bottom:1px solid #222;cursor:pointer;display:flex;gap:7px;align-items:center} .contact.active{background:#2a3942} .avatar{width:36px;height:36px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold} .top-chat{background:#202c33;padding:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px} .msgs{flex:1;overflow:auto;padding:10px;background:#0b141a} .msg{padding:9px;border-radius:10px;margin:4px 0;max-width:85%;font-size:13px} .me{background:#005c4b;margin-left:auto} .them{background:#202c33} .ai{background:#1a3a4a;border-left:3px solid #25D366} .bar{background:#202c33;padding:7px;display:flex;gap:5px} .bar input{flex:1;padding:11px;border-radius:20px;border:none;background:#2a3942;color:#fff} .btn{background:#25D366;width:40px;height:40px;border-radius:50%;border:none;color:#fff} .btn2{width:auto;padding:5px 8px;border-radius:12px;font-size:10px;background:#2a3942;border:none;color:#fff} .quick{display:flex;gap:3px;flex-wrap:wrap;padding:5px;background:#111b21} .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:99;justify-content:center;align-items:center} .modal-content{background:#202c33;padding:18px;border-radius:15px;max-width:400px;width:90%} .modal-content input,.modal-content select,.modal-content textarea{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:none;background:#2a3942;color:#fff;box-sizing:border-box} .price{color:#25D366;font-weight:bold;font-size:18px}</style></head><body>
<div class="left"><div class="top-big"><h1>FREDDY MAKOLA</h1><small style="color:#aaa">Technicien Chercheur - L'shi</small><div class="jobs"><button class="active" onclick="setJob('electricite',this)">⚡ Élec</button><button onclick="setJob('maconnerie',this)">🧱 Maçon</button><button onclick="setJob('mecanique',this)">🔧 Méca</button><button onclick="setJob('electronique',this)">📱 Élec'nique</button></div><div style="margin-top:6px;display:flex;gap:3px;justify-content:center;flex-wrap:wrap"><button class="btn2" onclick="loadPhoneContacts()">📲 Contacts</button><button class="btn2" onclick="addContactManu()">➕ Nouveau</button><button class="btn2" id="bAI" onclick="toggleAI()">🤖 IA OFF</button></div></div><div class="list" id="list"></div><div style="padding:8px;background:#111b21;border-top:1px solid #222;display:flex;gap:3px;flex-wrap:wrap"><button class="btn2" style="background:#25D366" onclick="partagerPro()">🚀 Partager</button><button class="btn2" style="background:#ff9800" onclick="window.open('diagnostic-client.html','_blank')">📸 Lien Client Photo</button><button class="btn2" style="background:#ff9800" onclick="openDiag()">🔍 Diagnostic</button><button class="btn2" style="background:#9c27b0" onclick="openLocation()">💼 Louer 10$</button></div></div>
<div class="right"><div class="top-chat"><span id="chatName" style="font-weight:bold;font-size:13px">Choisis contact</span><div style="display:flex;gap:3px;flex-wrap:wrap"><button class="btn2" onclick="voiceCall()">📞 Vocal</button><button class="btn2" onclick="videoCall()">🎥 Vidéo</button><button class="btn2" style="background:#25D366" onclick="faireDevis()">🧾 Devis</button><a href="index.html" style="color:#25D366;text-decoration:none;font-size:12px">🏠</a></div></div><div class="quick" id="quickBtns"></div><div class="msgs" id="box"></div><div class="bar"><input id="txt" placeholder="Message..." onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">➤</button></div></div>
<div class="modal" id="modalDiag" onclick="if(event.target==this)closeDiag()"><div class="modal-content"><h3 style="color:#25D366;margin-top:0">🔍 Diagnostic IA - <span id="diagJobName"></span></h3><select id="panneType"></select><textarea id="diagDesc" rows="3" placeholder="Décris la panne..."></textarea><input type="file" id="diagPhoto" accept="image/*" onchange="previewPhoto(this)"><img id="photoPreview" style="display:none;max-width:100%;border-radius:8px;margin-top:8px;max-height:150px"><div id="diagResult" style="display:none;margin-top:10px;padding:10px;background:#1a3a4a;border-radius:8px"></div><button class="btn2" style="background:#25D366;width:100%;padding:12px;margin-top:8px" onclick="lancerDiag()">Lancer Diagnostic IA</button><button class="btn2" style="width:100%;padding:8px;margin-top:5px" onclick="closeDiag()">Fermer</button></div></div>
<div class="modal" id="modalLoc" onclick="if(event.target==this)closeLoc()"><div class="modal-content"><h3 style="color:#9c27b0;margin-top:0">💼 Louer Système 10$/mois</h3><p style="font-size:12px;color:#aaa">Tu loues ton WhatsApp Pro aux autres techniciens</p><input id="locName" placeholder="Nom technicien"><input id="locTel" placeholder="Tel 243..."><select id="locJob"><option value="electricite">⚡ Électricité</option><option value="maconnerie">🧱 Maçonnerie</option><option value="mecanique">🔧 Mécanique</option><option value="electronique">📱 Électronique</option></select><div style="background:#111b21;padding:10px;border-radius:8px;margin:8px 0;font-size:11px">✅ Son WhatsApp Pro avec son nom<br>✅ Devis auto<br>✅ Tarifs rapides<br>✅ Tu gardes 10$/mois</div><button class="btn2" style="background:#9c27b0;width:100%;padding:12px" onclick="creerLocation()">Créer + WhatsApp</button><button class="btn2" style="width:100%;padding:8px;margin-top:5px" onclick="closeLoc()">Fermer</button><div id="locList" style="margin-top:10px"></div></div></div>
<script>
let contacts=JSON.parse(localStorage.getItem('freddy_contacts')||'[]');let msgs=JSON.parse(localStorage.getItem('freddy_all_msgs')||'{}');let locataires=JSON.parse(localStorage.getItem('freddy_loc')||'[]');let current=null,aiMode=false,currentJob='electricite';
const JOBS={electricite:{name:'Électricité',tarifs:['Dépannage 15$','Prise 5$','Tableau 50$','Solaire 20$'],pannes:['Coupure totale','Disjoncteur saute','Prise chauffe','Lampe clignote','Compteur fou','Solaire/batterie']},maconnerie:{name:'Maçonnerie',tarifs:['Brique m2 25$','Crépissage m2 8$','Fondation ml 15$','Carrelage m2 12$'],pannes:['Mur fissuré','Fondation affaissée','Carrelage décollé','Infiltration eau','Devis construction']},mecanique:{name:'Mécanique',tarifs:['Vidange 20$','Freins 30$','Moteur diag 25$','Pneu 10$'],pannes:['Moteur ne démarre pas','Freins grincent','Surchauffe','Fuite huile','Vidange']},electronique:{name:'Électronique',tarifs:['Téléphone diag 5$','TV réparation 20$','Soudure 10$','Déblocage 8$'],pannes:['Téléphone écran noir','Ne charge pas','TV pas image','Télécommande HS','Carte mère']}};
function setJob(job,el){currentJob=job;document.querySelectorAll('.jobs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderQuick();save();}
function renderQuick(){let q=document.getElementById('quickBtns');q.innerHTML='';JOBS[currentJob].tarifs.forEach(t=>{let b=document.createElement('button');b.className='btn2';b.textContent=t;b.onclick=()=>{document.getElementById('txt').value=t+' - '+JOBS[currentJob].name;};q.appendChild(b);});let b2=document.createElement('button');b2.className='btn2';b2.style.background='#25D366';b2.textContent='📍 Dispo';b2.onclick=()=>{document.getElementById('txt').value='Dispo '+JOBS[currentJob].name+' L\'shi - Freddy 0983356734';};q.appendChild(b2);}
function save(){localStorage.setItem('freddy_contacts',JSON.stringify(contacts));localStorage.setItem('freddy_all_msgs',JSON.stringify(msgs));localStorage.setItem('freddy_loc',JSON.stringify(locataires));localStorage.setItem('freddy_job',currentJob);}
function renderContacts(){let l=document.getElementById('list');l.innerHTML='';contacts.forEach((c,i)=>{let d=document.createElement('div');d.className='contact'+(current===i?' active':'');d.innerHTML=`<div class="avatar">${c.name[0].toUpperCase()}</div><div><b>${c.name}</b><br><small style="color:#aaa">${c.tel} • ${c.job||currentJob}</small></div>`;d.onclick=()=>openChat(i);l.appendChild(d)});}
function openChat(i){current=i;document.getElementById('chatName').textContent=contacts[i].name+' - '+(contacts[i].job||currentJob);renderContacts();renderMsgs();}
function renderMsgs(){let b=document.getElementById('box');b.innerHTML='';if(current===null){b.innerHTML=`<div style="text-align:center;color:#888;margin-top:20px"><h2 style="color:#25D366">FREDDY MAKOLA</h2><b>${JOBS[currentJob].name.toUpperCase()}</b><br><br>👈 Contacts<br>🚀 Partager = lien client photo<br>📸 Lien Client = envoie photo panne<br>🔍 Diagnostic = ta photo + IA<br>💼 Louer = 10$/mois</div>`;return;}let id=contacts[current].tel;let list=msgs[id]||[];if(list.length==0){b.innerHTML='<div style="text-align:center;color:#888;margin-top:30px">Pas de message avec '+contacts[current].name+'</div>';return;}list.forEach(m=>{let d=document.createElement('div');d.className='msg '+m.c;d.innerHTML=m.t;b.appendChild(d)});b.scrollTop=b.scrollHeight}
function send(){let t=document.getElementById('txt').value.trim();if(!t||current===null)return alert('Choisis contact');let tel=contacts[current].tel;if(!msgs[tel])msgs[tel]=[];msgs[tel].push({t:t+'<br><small>'+new Date().toLocaleTimeString()+' | '+JOBS[currentJob].name+'</small>',c:'me'});save();renderMsgs();document.getElementById('txt').value='';if(aiMode){setTimeout(()=>{msgs[tel].push({t:'🤖 IA Freddy ('+JOBS[currentJob].name+'): Reçu.<br><small>'+new Date().toLocaleTimeString()+'</small>',c:'ai'});save();renderMsgs();},400);}else{window.open('https://wa.me/'+tel.replace(/\D/g,'')+'?text='+encodeURIComponent(t+' - '+JOBS[currentJob].name),'_blank');}}
async function loadPhoneContacts(){try{if(!('contacts' in navigator && 'ContactsManager' in window)){alert('Utilise ➕ Nouveau');return;}let c=await navigator.contacts.select(['name','tel'],{multiple:true});c.forEach(p=>{if(p.tel&&p.tel.length>0){contacts.push({name:p.name[0]||'Sans nom',tel:p.tel[0].replace(/\D/g,''),job:currentJob})}});save();renderContacts();}catch(e){alert('Refusé')}} 
function addContactManu(){let n=prompt('Nom:');if(!n)return;let t=prompt('Numéro 243...');if(!t)return;contacts.push({name:n,tel:t.replace(/\D/g,''),job:currentJob});save();renderContacts();}
function toggleAI(){aiMode=!aiMode;let b=document.getElementById('bAI');b.textContent=aiMode?'🤖 IA ON':'🤖 IA OFF';b.style.background=aiMode?'#25D366':'#2a3942';}
function voiceCall(){if(current===null)return alert('Choisis contact');window.open('https://wa.me/'+contacts[current].tel.replace(/\D/g,''), '_blank');}
function videoCall(){if(current===null)return alert('Choisis contact');window.open('https://wa.me/'+contacts[current].tel.replace(/\D/g,''), '_blank');}
function faireDevis(){if(current===null)return alert('Choisis contact');let client=contacts[current].name;let metier=JOBS[currentJob].name;let prix=prompt('Prix '+metier+':','15$');if(!prix)return;let detail=prompt('Détail:','Dépannage '+metier);let devis=`🧾 DEVIS FREDDY MAKOLA\n${metier}\nClient: ${client}\nTravail: ${detail}\nPrix: ${prix}\nDate: ${new Date().toLocaleDateString()}\nTel: 0983356734`;let tel=contacts[current].tel;if(!msgs[tel])msgs[tel]=[];msgs[tel].push({t:devis.replace(/\n/g,'<br>'),c:'me'});save();renderMsgs();window.open('https://wa.me/'+tel.replace(/\D/g,'')+'?text='+encodeURIComponent(devis),'_blank');}
function previewPhoto(input){if(input.files && input.files[0]){let reader=new FileReader();reader.onload=function(e){let img=document.getElementById('photoPreview');img.src=e.target.result;img.style.display='block';window._photoBase64=e.target.result;};reader.readAsDataURL(input.files[0]);}}
function partagerPro(){let lien="https://makola000.github.io/freddy-Makola/diagnostic-client.html";let texte=`⚡ *FREDDY MAKOLA - Technicien Chercheur* ⚡\n\nTu as une panne? Envoie-moi une PHOTO !\n\n🧱 Maçonnerie | ⚡ Électricité | 🔧 Mécanique | 📱 Électronique\n\n👉 Clique ici pour envoyer photo de ta panne:\n${lien}\n\n🔍 Diagnostic IA + 🧾 Devis gratuit en 5 min!\n📞 0983356734`;let choix=prompt("1=Copier lien CLIENT (photo)\n2=Partager sur WhatsApp\n3=Voir message","2");if(choix==="1"){navigator.clipboard.writeText(lien).then(()=>alert("Lien CLIENT copié: "+lien));}else if(choix==="2"){window.open('https://wa.me/?text='+encodeURIComponent(texte),'_blank');}else{alert(texte);}}
function openDiag(){document.getElementById('modalDiag').style.display='flex';document.getElementById('diagJobName').textContent=JOBS[currentJob].name;let sel=document.getElementById('panneType');sel.innerHTML='';JOBS[currentJob].pannes.forEach(p=>{let o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);});document.getElementById('diagResult').style.display='none';document.getElementById('photoPreview').style.display='none';}
function closeDiag(){document.getElementById('modalDiag').style.display='none';}
function lancerDiag(){let type=document.getElementById('panneType').value;let desc=document.getElementById('diagDesc').value;let r=document.getElementById('diagResult');let diag="",prix="",cons="";if(currentJob=='electricite'){diag="Court-circuit ou surcharge probable.";prix="15-25$";cons="Couper disjoncteur, ne pas toucher fil dénudé.";}else if(currentJob=='maconnerie'){diag="Fissure ou infiltration, visite chantier.";prix="Devis gratuit";cons="Éviter zone.";}else if(currentJob=='mecanique'){diag="Panne moteur/frein, diag valise.";prix="25$ diag";cons="Ne pas rouler si frein chaud.";}else{diag="Panne carte/soudure.";prix="5-20$";cons="Débrancher appareil.";}r.style.display='block';let hasPhoto = window._photoBase64 ? "✅ Photo analysée" : "⚠️ Ajoute photo pour mieux voir";r.innerHTML=`<b>🤖 IA:</b> ${diag}<br><br><b>Type:</b> ${type}<br><b>Détail:</b> ${desc||'Photo'}<br><b>${hasPhoto}</b><br><br><span class="price">${prix}</span><br><small style="color:#ffcc00">⚠️ ${cons}</small><br><br><button class="btn2" style="background:#25D366;width:100%;padding:10px" onclick="envoyerDiagWA()">📲 Envoyer à Freddy</button>`;window._diagMsg=`Diagnostic ${JOBS[currentJob].name}: ${type} - ${desc} - ${prix} - Photo: ${window._photoBase64?"OUI":"NON"}`;}
function envoyerDiagWA(){window.open('https://wa.me/243983356734?text='+encodeURIComponent(window._diagMsg),'_blank');closeDiag();}
function openLocation(){document.getElementById('modalLoc').style.display='flex';renderLoc();}
function closeLoc(){document.getElementById('modalLoc').style.display='none';}
function creerLocation(){let n=document.getElementById('locName').value;let t=document.getElementById('locTel').value;let j=document.getElementById('locJob').value;if(!n||!t)return alert('Nom + Tel');locataires.push({name:n,tel:t.replace(/\D/g,''),job:j,date:new Date().toLocaleDateString()});save();let lien="https://makola000.github.io/freddy-Makola/diagnostic-client.html";let msg=`Salut ${n}! Je t'ai créé ton WhatsApp Pro.\nMétier: ${JOBS[j].name}\nLien client photo: ${lien}\n10$/mois - Freddy 0983356734`;window.open('https://wa.me/'+t.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank');renderLoc();}
function renderLoc(){let d=document.getElementById('locList');d.innerHTML='<b style="font-size:12px">Tes locataires ('+locataires.length+'): </b><br>';locataires.forEach(l=>{d.innerHTML+=`<small>${l.name} - ${l.job} - ${l.tel}</small><br>`});d.innerHTML+=`<br><b style="color:#25D366">Revenu: ${locataires.length*10}$/mois</b>`;}
currentJob=localStorage.getItem('freddy_job')||'electricite';renderQuick();renderContacts();renderMsgs();
</script></body></html>
