<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WhatsApp Freddy - Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{height:100vh;display:flex;flex-direction:column;background:#0b141a;color:#fff;overflow:hidden}
.top{padding:12px;background:#202c33;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.main{flex:1;display:flex;overflow:hidden}
.left{width:40%;background:#111b21;border-right:1px solid #222;display:flex;flex-direction:column;overflow:hidden}
.left-top{padding:10px;display:flex;gap:5px;flex-shrink:0}
.left-top input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}
.contacts{flex:1;overflow-y:auto}
.c{padding:12px;border-bottom:1px solid #1f2c34;display:flex;gap:10px;cursor:pointer;align-items:center}
.c:hover{background:#202c33} .c.active{background:#2a3942}
.c img{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;padding:15px;overflow-y:auto;background-color:#0b141a}
.b{background:#202c33;padding:10px 14px;border-radius:8px;margin:6px 0;max-width:75%;position:relative;word-break:break-word}
.b.me{background:#005c4b;margin-left:auto}
.b small{font-size:10px;color:#aaa;display:block;margin-top:5px}
.del{position:absolute;top:-8px;right:-8px;background:red;color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;display:none}
.b:hover .del{display:block}
.bar{padding:8px;background:#202c33;display:flex;gap:6px;align-items:center;flex-shrink:0;position:sticky;bottom:0;width:100%;border-top:1px solid #222}
.bar input{flex:1;min-width:50px;padding:12px;border-radius:25px;border:none;background:#2a3942;color:#fff;font-size:16px}
.bar button{flex-shrink:0;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:none;cursor:pointer}
.call-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#111b21;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99}
.call-screen video{width:90%;max-width:400px;height:60%;background:#000;border-radius:15px}
@media(max-width:600px){.left{width:35%}.c b{font-size:12px}}
</style>
</head>
<body>

<div class="top">
<b style="color:#25D366">WhatsApp Freddy</b>
<div style="display:flex;gap:6px">
<button onclick="importContacts()" style="background:#25D366;padding:6px 10px;border-radius:20px;color:#fff;font-size:12px">+ Contacts</button>
<button onclick="addManual()" style="background:#fff;padding:6px 10px;border-radius:20px;color:#000;font-size:12px">+ Num</button>
<a href="index.html" style="color:#25D366;text-decoration:none;margin-left:5px">🏠</a>
</div>
</div>

<div class="main">
<div class="left">
<div class="left-top"><input id="searchContact" placeholder="Chercher..." oninput="filterContacts()"></div>
<div class="contacts" id="contactsList"></div>
</div>

<div class="right">
<div class="msgs" id="msgs"></div>

<div class="bar">
<label style="background:#2a3942;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">📎<input type="file" id="fileInput" accept="video/*,image/*,audio/*" style="display:none" onchange="shareFile(this)"></label>
<button onclick="startVoice()" id="voiceBtn" style="background:#2a3942">🎤</button>
<input id="txt" placeholder="Message..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()" style="background:#25D366;color:#fff;font-weight:bold">➤</button>
<button onclick="startAudioCall()" style="background:#2a3942">📞</button>
<button onclick="startVideoCall()" style="background:#2a3942">🎥</button>
</div>

</div>
</div>

<div class="call-screen" id="callScreen">
<h2 id="callName">Appel...</h2>
<video id="videoCall" autoplay muted playsinline></video>
<p id="timer" style="margin-top:15px;font-size:24px">00:00</p>
<div style="display:flex;gap:15px;margin-top:20px">
<button style="background:red;padding:15px 25px;border-radius:50%;width:60px;height:60px" onclick="endCall()">❌</button>
<button style="background:#2a3942;padding:15px 25px;border-radius:50%;width:60px;height:60px" onclick="toggleMute()">🔇</button>
</div>
</div>

<script>
let contacts = JSON.parse(localStorage.getItem('freddy_contacts')||'[]')
let messages = JSON.parse(localStorage.getItem('freddy_msgs')||'{}')
let currentContact = null
let stream, mediaRecorder, chunks=[], isRec=false, timerInt, sec=0

function renderContacts(filter=''){
  let list=document.getElementById('contactsList'); list.innerHTML=''
  contacts.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase())||c.phone.includes(filter)).forEach((c,i)=>{
    let div=document.createElement('div'); div.className='c'+(currentContact==c.phone?' active':'')
    div.innerHTML=`<img src="https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=25D366&color=fff"><div style="overflow:hidden"><b style="white-space:nowrap">${c.name}</b><br><small style="font-size:10px">${c.phone}</small></div>`
    div.onclick=()=>openChat(c.phone)
    list.appendChild(div)
  })
}
function openChat(phone){currentContact=phone; renderContacts(); renderMessages()}
function renderMessages(){
  let box=document.getElementById('msgs'); box.innerHTML=''
  let msgs=messages[currentContact]||[]
  msgs.forEach((m,idx)=>{
    let d=document.createElement('div'); d.className='b'+(m.me?' me':'')
    if(m.type=='text') d.innerHTML=`${m.text}<small>${m.time} ✓✓</small><button class="del" onclick="deleteMsg(${idx})">x</button>`
    if(m.type=='video' || m.type=='image') d.innerHTML=`${m.type=='video'?`<video src="${m.url}" controls style="max-width:100%;border-radius:8px"></video>`:`<img src="${m.url}" style="max-width:100%;border-radius:8px">`}<small>${m.time}</small><button class="del" onclick="deleteMsg(${idx})">x</button>`
    if(m.type=='voice') d.innerHTML=`<audio controls src="${m.url}" style="width:180px"></audio><small>${m.time}</small><button class="del" onclick="deleteMsg(${idx})">x</button>`
    box.appendChild(d)
  })
  box.scrollTop=box.scrollHeight
}
function save(){localStorage.setItem('freddy_contacts',JSON.stringify(contacts)); localStorage.setItem('freddy_msgs',JSON.stringify(messages))}
function send(){
  if(!currentContact){alert('Choisis un contact d\'abord à gauche'); return}
  let v=document.getElementById('txt').value; if(!v)return
  if(!messages[currentContact]) messages[currentContact]=[]
  messages[currentContact].push({type:'text',text:v,me:true,time:new Date().toLocaleTimeString()})
  save(); renderMessages(); document.getElementById('txt').value=''
}
function deleteMsg(i){if(confirm('Supprimer ce message ?')){messages[currentContact].splice(i,1); save(); renderMessages()}}
function filterContacts(){renderContacts(document.getElementById('searchContact').value)}
function addManual(){
  let name=prompt('Nom du contact :'); if(!name)return
  let phone=prompt('Numéro WhatsApp (ex: +243...)'); if(!phone)return
  contacts.push({name,phone}); save(); renderContacts()
}
async function importContacts(){
  if('contacts' in navigator && 'ContactsManager' in window){
    try{
      const props=['name','tel']; const cts=await navigator.contacts.select(props,{multiple:true})
      cts.forEach(c=>{if(c.tel[0]) contacts.push({name:c.name[0]||c.tel[0], phone:c.tel[0]})})
      save(); renderContacts(); alert(cts.length+' contacts importés !'); return
    }catch(e){}
  }
  alert('Sur ce téléphone, clique sur + Num pour ajouter. Ils resteront pour toujours.')
}
function shareFile(input){
  if(!currentContact){alert('Choisis contact'); return}
  let file=input.files[0]; if(!file)return
  let url=URL.createObjectURL(file)
  let type=file.type.startsWith('video')?'video':file.type.startsWith('image')?'image':'voice'
  if(!messages[currentContact]) messages[currentContact]=[]
  messages[currentContact].push({type,url,me:true,time:new Date().toLocaleTimeString()})
  save(); renderMessages()
}
async function startAudioCall(){
  if(!currentContact)return alert('Choisis contact')
  document.getElementById('callScreen').style.display='flex'
  document.getElementById('callName').textContent='📞 '+currentContact
  document.getElementById('videoCall').style.display='none'
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true}); startTimer()}catch(e){alert('Autorise micro')}
}
async function startVideoCall(){
  if(!currentContact)return alert('Choisis contact')
  document.getElementById('callScreen').style.display='flex'
  document.getElementById('callName').textContent='🎥 '+currentContact
  document.getElementById('videoCall').style.display='block'
  try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); document.getElementById('videoCall').srcObject=stream; startTimer()}catch(e){alert('Autorise caméra')}
}
function endCall(){document.getElementById('callScreen').style.display='none'; if(stream)stream.getTracks().forEach(t=>t.stop()); clearInterval(timerInt); sec=0; document.getElementById('timer').textContent='00:00'}
function startTimer(){timerInt=setInterval(()=>{sec++; let m=String(Math.floor(sec/60)).padStart(2,'0'); let s=String(sec%60).padStart(2,'0'); document.getElementById('timer').textContent=m+':'+s},1000)}
function toggleMute(){if(stream)stream.getAudioTracks().forEach(t=>t.enabled=!t.enabled)}
function startVoice(){
  if(!currentContact)return alert('Choisis contact')
  let btn=document.getElementById('voiceBtn')
  if(!isRec){
    navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
      stream=s; mediaRecorder=new MediaRecorder(s); chunks=[]
      mediaRecorder.ondataavailable=e=>chunks.push(e.data)
      mediaRecorder.onstop=()=>{
        let blob=new Blob(chunks,{type:'audio/webm'}); let url=URL.createObjectURL(blob)
        if(!messages[currentContact]) messages[currentContact]=[]
        messages[currentContact].push({type:'voice',url,me:true,time:new Date().toLocaleTimeString()})
        save(); renderMessages()
      }
      mediaRecorder.start(); isRec=true; btn.textContent='⏹️'; btn.style.background='red'
    })
  }else{
    mediaRecorder.stop(); stream.getTracks().forEach(t=>t.stop()); isRec=false; btn.textContent='🎤'; btn.style.background='#2a3942'
  }
}
renderContacts()
if(contacts.length>0){currentContact=contacts[0].phone; renderContacts(); renderMessages()}
</script>
</body>
</html>
