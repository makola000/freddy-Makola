<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>FREDDY APP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;height:100vh;font-family:sans-serif;background:#111}
.whatsapp{width:35%;background:#111b21;color:#fff;display:flex;flex-direction:column}
.wh-head{background:#202c33;padding:12px;display:flex;justify-content:space-between}
.chats{flex:1;overflow-y:auto}
.chat{padding:12px;border-bottom:1px solid #222;display:flex;gap:10px}
.chat:hover{background:#202c33}
.center{flex:1;background:#0b141a;display:flex;flex-direction:column}
.msg-area{flex:1;padding:15px;overflow-y:auto}
.msg{background:#005c4b;padding:8px 12px;border-radius:8px;margin:5px;max-width:70%}
.input{display:flex;padding:10px;background:#202c33;gap:8px}
.input input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}
.right{width:35%;background:#0f0f0f;display:flex;flex-direction:column}
.yt-search{display:flex;padding:8px;gap:5px;background:#212121}
.yt-search input{flex:1;padding:8px;border-radius:20px;border:1px solid #444;background:#121212;color:#fff}
.google{padding:10px;background:#fff}
.google input{width:100%;padding:12px;border-radius:25px;border:1px solid #ddd;box-shadow:0 1px 3px #ccc}
</style>
</head>
<body>

<div class="whatsapp">
<div class="wh-head"><b>WhatsApp</b><span>•••</span></div>
<div class="chats">
<div class="chat"><b>💬</b><div><b>Maman</b><br><small>Ok à tout à l'heure</small></div></div>
<div class="chat"><b>🔥</b><div><b>Client</b><br><small>Produit dispo ?</small></div></div>
<div class="chat"><b>👤</b><div><b>Freddy</b><br><small>En ligne</small></div></div>
</div>
</div>

<div class="center">
<div class="msg-area" id="msgs">
<div class="msg">Salut ! Ton appli WhatsApp marche ✅ Tape en bas</div>
</div>
<div class="input">
<input id="txt" placeholder="Tape un message">
<button onclick="send()" style="background:#25D366;border:none;padding:10px 15px;border-radius:50%">➤</button>
</div>
</div>

<div class="right">
<div class="google">
<input id="gSearch" placeholder="Rechercher sur Google..." onkeydown="if(event.key==='Enter')googleGo()">
</div>
<div class="yt-search">
<input id="ytSearch" placeholder="Rechercher YouTube...">
<button onclick="ytGo()" style="padding:8px 12px;border-radius:20px;background:red;color:#fff;border:none">🔍</button>
</div>
<iframe id="ytFrame" width="100%" height="100%" style="flex:1;border:none" src="https://www.youtube.com/embed/jNQXAC9IVRw" allowfullscreen></iframe>
</div>

<script>
function send(){
let v=document.getElementById('txt').value
if(!v)return
let d=document.createElement('div');d.className='msg';d.textContent=v
document.getElementById('msgs').appendChild(d)
document.getElementById('txt').value=''
}
function googleGo(){
let q=document.getElementById('gSearch').value
if(q) window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')
}
function ytGo(){
let q=document.getElementById('ytSearch').value
if(q) document.getElementById('ytFrame').src='https://www.youtube.com/embed?listType=search&list='+encodeURIComponent(q)
}
</script>
</body>
</html>
